{% load static %}

<!-- HEADER SUPERIOR (Logo y Carrito) -->
<nav class="navbar pucakes-navbar fixed-top" style="background: transparent;">
  <div class="container-fluid align-items-center">
    <!-- LOGO -->
    <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'home' %}">
      <img src="{% static 'products/img/logo.png' %}" alt="Pucakes logo" class="navbar-logo" style="height: 50px;">
    </a>

    <!-- CARRITO -->
    <button 
        class="btn-cart-circle position-relative ms-auto" 
        type="button" 
        data-bs-toggle="offcanvas" 
        data-bs-target="#cartSidebar" 
        aria-controls="cartSidebar">
        
        <i class="fas fa-shopping-basket"></i>
        
        {% if cart_count > 0 %}
        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.6rem;">
            {{ cart_count }}
        </span>
        {% endif %}
    </button>
  </div>
</nav>
