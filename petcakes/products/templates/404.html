{% extends "products/base.html" %}
{% load static %}

{% block content %}
<div class="container d-flex flex-column justify-content-center align-items-center text-center" style="min-height: 60vh; padding: 50px 0;">
    
    <h2 class="mb-4 fw-bold">¡Ups! Esta página se la comió el perro... 🐶</h2>
    
    <div class="my-4" style="max-width: 200px;">
        <img src="{% static 'products/img/huellas.png' %}" alt="Huellitas" class="img-fluid">
    </div>

    <p class="lead text-muted mb-5" style="max-width: 600px;">
        Lo sentimos, no pudimos encontrar lo que buscabas. Tal vez era demasiado delicioso y desapareció, o quizás el enlace está roto.
    </p>

    <div class="d-flex gap-3 flex-wrap justify-content-center">
        <a href="{% url 'home' %}" class="btn btn-outline-secondary rounded-0 px-4 py-2">
            <i class="fas fa-home me-2"></i> Ir al Inicio
        </a>
        <a href="{% url 'catalogo' %}" class="btn btn-primary rounded-0 px-4 py-2">
            <i class="fas fa-cookie-bite me-2"></i> Ver cosas ricas
        </a>
    </div>

</div>
{% endblock %}
